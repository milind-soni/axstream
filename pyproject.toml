[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axstream"
version = "0.1.0"
description = "Fast, verified computer use for agents: a streaming JSONL action spec, a verified click ladder, and macros that make repeat tasks instant"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["computer-use", "automation", "macos", "agents", "mcp", "accessibility"]
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://axstream.dev"
Documentation = "https://axstream.dev/docs/quickstart"
Repository = "https://github.com/milind-soni/axstream"

[project.scripts]
axstream = "axstream.__main__:main"

[project.optional-dependencies]
voice = [
    "parakeet-mlx>=0.5.2",
    "sounddevice>=0.5.5",
]
# the OCR text-anchor replay rung (Apple Vision via pyobjc — macOS only).
# Optional: without it replay skips the rung and falls through to pixels.
ocr = [
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
]
# the visual patch-anchor replay rung (template-match crops via OpenCV).
# Optional: without it replay skips the rung and falls through to pixels.
patch = [
    "opencv-python-headless>=4.9",
]


[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
