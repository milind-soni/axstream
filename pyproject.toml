[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axstream"
version = "0.1.3"
description = "Fast, verified computer use for agents: a streaming JSONL action spec, a verified click ladder, and macros that make repeat tasks instant"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["computer-use", "automation", "macos", "agents", "mcp", "accessibility"]
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    # OCR is core, not optional: the text-anchor click rung, outcome
    # assertions (the verify gate's evaluator), and the screen_text/find/
    # check MCP tools all run on it. macOS-only by marker; a bare install
    # elsewhere still works (the rung reports itself unavailable).
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://axstream.dev"
Documentation = "https://axstream.dev/docs/quickstart"
Repository = "https://github.com/milind-soni/axstream"

[project.scripts]
axstream = "axstream.__main__:main"

[project.optional-dependencies]
voice = [
    "parakeet-mlx>=0.5.2",
    "sounddevice>=0.5.5",
]
# back-compat alias: OCR became a DEFAULT dependency in 0.1.1 —
# `axstream[ocr]` keeps working for anyone following older docs.
ocr = []
# the visual patch-anchor replay rung (template-match crops via OpenCV).
# Optional: without it replay skips the rung and falls through to pixels.
patch = [
    "opencv-python-headless>=4.9",
]


[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
